name: Rails CI/CD

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      environment:
        required: false
        default: production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Simulate test run
        run: echo "Tests passed"
      
      - name: Simulate security scan
        run: echo "Security scan passed"

      - name: Simulate Docker build
        run: echo "Docker build successful (simulated)"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
  
    # NOTE: Deployment steps are simulated as this is a design-only exercise
  
    steps:
      - uses: actions/checkout@v4
  
      - name: Simulate AWS authentication
        run: echo "OIDC authentication successful"
  
      - name: Simulate image push to ECR
        run: echo "Docker image pushed to ECR"
  
      - name: Simulate ECS deployment
        run: echo "ECS service updated successfully"
  
      - name: Simulate deployment stability check
        run: echo "Service reached stable state"
