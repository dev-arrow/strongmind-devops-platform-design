name: Rails CI/CD

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      environment:
        required: false
        default: production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Simulate test run
        run: echo "Tests passed"
      
      - name: Simulate security scan
        run: echo "Security scan passed"

      - name: Simulate Docker build
        run: echo "Docker build successful (simulated)"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-oidc-role
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Image
        run: |
          IMAGE=${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
          docker build -t $IMAGE .
          docker tag $IMAGE ${{ secrets.ECR_REPOSITORY }}:latest
          docker push $IMAGE
          docker push ${{ secrets.ECR_REPOSITORY }}:latest

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition rails-app \
            --query taskDefinition > task.json

      - name: Update image in task definition
        run: |
          jq --arg IMAGE "${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}" \
          '.containerDefinitions[0].image=$IMAGE' task.json > new-task.json

      - name: Register new task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://new-task.json

      - name: Deploy
        run: |
          aws ecs update-service \
            --cluster strongmind-production \
            --service rails-app \
            --force-new-deployment

      - name: Wait for stability
        run: |
          aws ecs wait services-stable \
            --cluster strongmind-production \
            --services rails-app

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed - rollback required"
